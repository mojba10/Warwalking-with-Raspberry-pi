<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warwalking Project</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #00ffcc; 
            --bg-dark: #0a0e14;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --table-header-bg: rgba(0, 255, 204, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
            padding-top: 100px; 
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .wifi-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 2.5rem;
            color: var(--primary-color);
            transform: rotate(-15deg);
            z-index: 10000;
            text-shadow: 0 0 15px var(--primary-color);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: rotate(-15deg) scale(1); }
            50% { opacity: 1; transform: rotate(-15deg) scale(1.1); }
            100% { opacity: 0.4; transform: rotate(-15deg) scale(1); }
        }

        #map { 
            height: 500px; 
            width: 90%; 
            margin: 30px auto; 
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }

        .container, .data-table {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            width: 90%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary-color);
            margin-bottom: 20px;
        }
        
        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
 
        .view-toggle button {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: background-color 0.3s, color 0.3s;
        }
 
        .view-toggle button.active {
            background-color: var(--primary-color);
            color: var(--bg-dark);
        }

        .data-table {
            width: 90%;
            border-collapse: separate; 
            border-spacing: 0;
            margin-top: 30px;
            overflow: hidden; 
        }

        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table thead th {
            background-color: var(--table-header-bg);
            backdrop-filter: blur(5px);
            color: var(--primary-color);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary-color);
        }
        
        .data-table tbody tr:last-child td {
            border-bottom: none; 
        }

        .data-table tbody td {
            color: #ccc; 
        }

        .data-table tbody tr:hover {
            background-color: rgba(0, 255, 204, 0.1); 
            transform: scale(1.01); 
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2); 
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        
        .data-table tbody tr:not(:hover) {
             transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .action-button {
            background-color: var(--primary-color);
            color: var(--bg-dark);
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: background-color 0.3s, transform 0.3s;
        }

        .action-button:hover {
            background-color: #00e6b8;
            transform: translateY(-2px);
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .filter-bar input[type="text"],
        .filter-bar select,
        .filter-bar input[type="number"] {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .filter-bar input[type="text"] {
            min-width: 220px;
        }

        .filter-bar input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .filter-bar label {
            font-size: 12px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 6px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-filters {
            background-color: transparent;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s, color 0.2s;
        }

        .clear-filters:hover {
            background-color: #ff6b6b;
            color: var(--bg-dark);
        }

        .result-count {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="wifi-icon">
        <i class="fas fa-wifi"></i>
    </div>

    <div class="container">
        <h1>Warwalking</h1>
    </div>

    <div id="map"></div>

    <div class="container">
        <h2>Wifi Table</h2>

        <div class="view-toggle">
            <button id="btn-current" class="active" onclick="loadData('current')">CURRENT SCAN</button>
            <button id="btn-history" onclick="loadData('history')">HISTORY</button>
        </div>

        <div class="filter-bar">
            <input type="text" id="filter-search" placeholder="Search by SSID or BSSID..." oninput="applyFilters()">

            <div class="filter-group">
                <label for="filter-security">Security</label>
                <select id="filter-security" onchange="applyFilters()">
                    <option value="">All</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-evil">Evil</label>
                <select id="filter-evil" onchange="applyFilters()">
                    <option value="">All</option>
                    <option value="NONE">NONE</option>
                    <option value="LOW">LOW</option>
                    <option value="MEDIUM">MEDIUM</option>
                    <option value="HIGH">HIGH</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-min-risk">Min RISK</label>
                <input type="number" id="filter-min-risk" min="0" max="30" placeholder="0" style="width: 70px;" oninput="applyFilters()">
            </div>

            <button class="clear-filters" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="result-count" id="result-count"></div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>BSSID</th>
                    <th>SSID</th>
                    <th>Channel</th>
                    <th>Signal</th>
                    <th>Security</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>RISK</th>
                    <th>Evil</th>
                    <th>Timestamp</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="wifi-body">
            </tbody>
        </table>
    </div>

    <script>
    var map = L.map('map').setView([32.4279, 53.6880], 5);
 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
 
    var currentMarker = null;
 
    function flyToLocation(lat, lng) {
        if (!isNaN(lat) && !isNaN(lng)) {
            map.flyTo([lat, lng], 15);
            if (currentMarker !== null) {
                map.removeLayer(currentMarker);
            }
            currentMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup("Location Found")
                .openPopup();
        } else {
            console.error("Location not valid", lat, lng);
        }
    }
 
    function renderTable(rows) {
        var tbody = document.getElementById('wifi-body');
        tbody.innerHTML = '';
 
        rows.forEach(function (row) {
            var tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.id ?? ''}</td>
                <td>${row.BSSID ?? ''}</td>
                <td>${row.SSID ?? ''}</td>
                <td>${row.CHAN ?? ''}</td>
                <td>${row.SIGNAL ?? ''}</td>
                <td>${row.SECURITY ?? ''}</td>
                <td>${row.LATITUDE ?? ''}</td>
                <td>${row.LONGITUDE ?? ''}</td>
                <td>${row.TOTAL_RISK ?? ''}</td>
                <td>${row.EVIL ?? ''}</td>
                <td>${row.TIMESTAMP ?? ''}</td>
                <td>
                    <button class="action-button" data-lat="${row.LATITUDE}" data-lng="${row.LONGITUDE}">
                        Locate
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
 
        tbody.querySelectorAll('.action-button').forEach(function (button) {
            button.addEventListener('click', function () {
                var lat = parseFloat(this.getAttribute('data-lat'));
                var lng = parseFloat(this.getAttribute('data-lng'));
                flyToLocation(lat, lng);
            });
        });
    }
 
    var allRows = [];  // داده‌ی کامل و بدون فیلتر حالت فعلی (current یا history)

    function populateSecurityOptions(rows) {
        var select = document.getElementById('filter-security');
        var current = select.value;
        var values = Array.from(new Set(rows.map(r => r.SECURITY).filter(v => v))).sort();

        select.innerHTML = '<option value="">All</option>';
        values.forEach(function (v) {
            var opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            select.appendChild(opt);
        });
        if (values.includes(current)) {
            select.value = current;
        }
    }

    function applyFilters() {
        var search = document.getElementById('filter-search').value.trim().toLowerCase();
        var security = document.getElementById('filter-security').value;
        var evil = document.getElementById('filter-evil').value;
        var minRiskRaw = document.getElementById('filter-min-risk').value;
        var minRisk = minRiskRaw === '' ? null : parseFloat(minRiskRaw);

        var filtered = allRows.filter(function (row) {
            if (search) {
                var ssid = (row.SSID ?? '').toString().toLowerCase();
                var bssid = (row.BSSID ?? '').toString().toLowerCase();
                if (!ssid.includes(search) && !bssid.includes(search)) {
                    return false;
                }
            }
            if (security && row.SECURITY !== security) {
                return false;
            }
            if (evil && row.EVIL !== evil) {
                return false;
            }
            if (minRisk !== null && !(parseFloat(row.TOTAL_RISK) >= minRisk)) {
                return false;
            }
            return true;
        });

        renderTable(filtered);

        var countEl = document.getElementById('result-count');
        countEl.textContent = filtered.length + ' of ' + allRows.length + ' networks shown';
    }

    function clearFilters() {
        document.getElementById('filter-search').value = '';
        document.getElementById('filter-security').value = '';
        document.getElementById('filter-evil').value = '';
        document.getElementById('filter-min-risk').value = '';
        applyFilters();
    }

    function loadData(view) {
        var endpoint = view === 'current' ? '/api/current' : '/api/history';
 
        document.getElementById('btn-current').classList.toggle('active', view === 'current');
        document.getElementById('btn-history').classList.toggle('active', view === 'history');
 
        fetch(endpoint)
            .then(res => res.json())
            .then(rows => {
                allRows = rows;
                populateSecurityOptions(rows);
                applyFilters();
            });
    }
 
    document.addEventListener('DOMContentLoaded', function () {
        loadData('current'); 
    });
    </script>
 
</body>
</html>
